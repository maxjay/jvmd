name: JVMD memory profile

# Reproduces docs/jvmd-memory-allocation-profile.md: one job per profiling mode over the pinned apache/maven
# lifecycle, plus the seed-scaling experiment. Raw evidence (JFR, HPROF, NMT, smaps, histograms) is uploaded
# as workflow artifacts; nothing large is committed. Informational only, never a gate.
on:
  workflow_dispatch:
  # Temporary: runs once from the investigation branch to produce the retained evidence; removed afterwards.
  push:
    branches: [ccr-d4329637-lywgzk]
    paths: [.github/workflows/memory-profile.yml]

permissions:
  contents: read

env:
  APACHE_MAVEN: 5cd1b60264101080c712accd605180a4bd9222e0
  ASYNC_PROFILER: https://github.com/async-profiler/async-profiler/releases/download/v4.1/async-profiler-4.1-linux-x64.tar.gz
  MAT: https://download.eclipse.org/mat/1.16.1/rcp/MemoryAnalyzer-1.16.1.20250109-linux.gtk.x86_64.zip

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile:
          # Primary: default configuration, one profiling mode per job.
          - {name: control, args: --mode control}
          - {name: exact, args: --mode exact}
          - {name: alloc, args: --mode alloc}
          - {name: live, args: --mode live}
          - {name: retention, args: --mode retention}
          - {name: nmt, args: --mode nmt}
          - {name: native, args: --mode native}
          - {name: rss, args: --mode rss}
          # Supplementary: RocksDB native budget 256 MiB, references skipped, so every later phase is reached.
          - {name: b256-control, args: --mode control --native-budget-mb 256 --skip-references}
          - {name: b256-exact, args: --mode exact --native-budget-mb 256 --skip-references}
          - {name: b256-alloc, args: --mode alloc --native-budget-mb 256 --skip-references}
          - {name: b256-live, args: --mode live --native-budget-mb 256 --skip-references}
          - {name: b256-retention, args: --mode retention --native-budget-mb 256 --skip-references}
          - {name: b256-nmt, args: --mode nmt --native-budget-mb 256 --skip-references}
          - {name: b256-native, args: --mode native --native-budget-mb 256 --skip-references}
          - {name: b256-rss, args: --mode rss --native-budget-mb 256 --skip-references}
          - {name: b256-pressure-512, args: --mode exact --heap 512 --native-budget-mb 256 --skip-references}
          # First-use references to completion (OOM at 1 GiB): allocation sites and the retained graph at OOM.
          - {name: b256-refs-alloc, args: --mode alloc --native-budget-mb 256}
          - {name: b256-refs-retention, args: --mode retention --native-budget-mb 256}
          - {name: scale, args: scale}
          - {name: restartfail, args: restartfail}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned JDK 25, async-profiler and Eclipse MAT
        run: |
          d="$RUNNER_TEMP/downloads"; mkdir -p "$d" "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$d/jdk25.tar.gz"
          echo "dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e  $d/jdk25.tar.gz" | sha256sum -c -
          tar -xzf "$d/jdk25.tar.gz" -C "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 "$ASYNC_PROFILER" | tar -xz -C "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 "$MAT" -o "$d/mat.zip" && unzip -q "$d/mat.zip" -d "$RUNNER_TEMP/tools/mat"
          sed -i 's/^-Xmx.*/-Xmx6g/' "$RUNNER_TEMP/tools/mat/mat/MemoryAnalyzer.ini"
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
          echo "ASYNC_PROFILER_HOME=$RUNNER_TEMP/tools/async-profiler-4.1-linux-x64" >> "$GITHUB_ENV"
          echo "MAT_HOME=$RUNNER_TEMP/tools/mat/mat" >> "$GITHUB_ENV"
      - name: Build JVMD
        run: mvn -B -q -DskipTests install && bash jvmd-dist/assemble.sh
      - name: Cache apache/maven fixture
        id: project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/apache-maven
            ${{ runner.temp }}/apache-maven-repository
          key: apache-maven-${{ env.APACHE_MAVEN }}-v1
      - name: Prepare apache/maven fixture
        if: steps.project.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/apache/maven.git "$RUNNER_TEMP/apache-maven"
          git -C "$RUNNER_TEMP/apache-maven" checkout -q "$APACHE_MAVEN"
          cd "$RUNNER_TEMP/apache-maven"
          mvn -B -q -DskipTests -Dmaven.repo.local="$RUNNER_TEMP/apache-maven-repository" -Drat.skip -Dspotless.skip -Dcheckstyle.skip -Denforcer.skip install
      - name: Profile
        env:
          ARGS: ${{ matrix.profile.args }}
          NAME: ${{ matrix.profile.name }}
        run: |
          out="$RUNNER_TEMP/memory"; mkdir -p "$out"
          project=(--project "$RUNNER_TEMP/apache-maven" --project-repository "$RUNNER_TEMP/apache-maven-repository")
          profile() { node benchmarks/memory/profile.ts --output "$out/$1" "${@:2}"; }
          case "$ARGS" in
            scale)
              for n in 0 100 250 350; do
                python3 benchmarks/memory/subset_repository.py "$RUNNER_TEMP/apache-maven-repository" "$RUNNER_TEMP/repos/n$n" --count "$n"
                profile "scale-n$n" --mode exact --seed-only --seed-restart --repository "$RUNNER_TEMP/repos/n$n"
              done
              profile scale-full --mode exact --seed-only --seed-restart --repository "$RUNNER_TEMP/apache-maven-repository"
              for j in javax.inject-1.jar commons-lang3-3.20.0.jar guava-33.4.8-jre.jar groovy-4.0.15.jar; do
                python3 benchmarks/memory/subset_repository.py "$RUNNER_TEMP/apache-maven-repository" "$RUNNER_TEMP/repos/one-${j%.jar}" --jars "$j"
                profile "jar-${j%.jar}" --mode exact --seed-only --repository "$RUNNER_TEMP/repos/one-${j%.jar}"
              done
              profile scale-full-nmt --mode nmt --seed-only --seed-restart --repository "$RUNNER_TEMP/apache-maven-repository"
              profile scale-full-native --mode native --seed-only --seed-restart --repository "$RUNNER_TEMP/apache-maven-repository" ;;
            restartfail)
              # A default-configuration lifecycle leaves the state whose reopen fails; that reopen is then profiled directly.
              profile lifecycle --mode control --no-restart "${project[@]}"
              for m in exact nmt native alloc; do
                profile "restartfail-$m" --mode "$m" --seed-only --reuse-state "$out/lifecycle/state/jvmd" --repository "$RUNNER_TEMP/apache-maven-repository"
              done ;;
            *) profile "$NAME" $ARGS "${project[@]}" ;;
          esac
      - name: Reduce
        if: always()
        run: |
          out="$RUNNER_TEMP/memory"
          python3 benchmarks/memory/analyze.py $(ls -d "$out"/*/ | grep -v /summary/) --out "$out/summary"
          for dump in "$out"/*/dumps/*.hprof; do
            [ -f "$dump" ] || continue
            bash benchmarks/memory/mat.sh "$dump" "$out/summary/mat/$(basename "${dump%.hprof}")"
            gzip -1 "$dump"
          done
          rm -rf "$out"/*/state "$out"/*/dumps/*.index "$out"/*/dumps/*.threads
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-${{ matrix.profile.name }}
          retention-days: 90
          path: ${{ runner.temp }}/memory
