name: Resident semantic proof (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned JDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/downloads/temurin25.tar.gz
          key: jdk-${{ runner.os }}-${{ runner.arch }}-dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e

      - name: Install checksum-pinned Temurin 25.0.4.1+1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/jvmd-toolchain"
          [[ -f "$RUNNER_TEMP/downloads/temurin25.tar.gz" ]] || curl -fsSL --retry 3 \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' \
            -o "$RUNNER_TEMP/downloads/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/downloads/temurin25.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/downloads/temurin25.tar.gz" -C "$RUNNER_TEMP/jvmd-toolchain"
          echo "JAVA_HOME=$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"

      - name: Build JVMD without tests
        run: mvn -B -DskipTests install

      - name: Deterministic 1,000-member baseline
        run: mvn -B -pl jvmd-tests -Dtest=ResidentSemanticBaselineProofTest test

      - name: Restore prepared Apache Maven fixture
        id: fixture
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/apache-maven-fixture
          key: apache-maven-lsp-v1

      - name: Prepare Apache Maven fixture
        if: steps.fixture.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/apache/maven.git "$RUNNER_TEMP/apache-maven-fixture"
          git -C "$RUNNER_TEMP/apache-maven-fixture" checkout 5cd1b60264101080c712accd605180a4bd9222e0
          cd "$RUNNER_TEMP/apache-maven-fixture"
          mvn -B -DskipTests install

      - name: Apache Maven completion baseline
        env:
          JVMD_RESIDENT_PROOF_MAVEN_ROOT: ${{ runner.temp }}/apache-maven-fixture
        run: mvn -B -pl jvmd-tests -Dtest=ResidentSemanticMavenProofTest test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resident-semantic-proof
          path: jvmd-tests/target/surefire-reports/
