name: JVMD roadmap

on:
  pull_request:
    paths:
      - 'benchmarks/roadmap/**'
      - 'jvmd-*/**'
      - 'shim/src/**'
      - '.github/workflows/roadmap.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/roadmap/**'
      - 'jvmd-*/**'
      - 'shim/src/**'
      - '.github/workflows/roadmap.yml'
  workflow_dispatch:
    inputs:
      runs:
        description: Repeat the whole suite this many times for steadier latency and allocation numbers
        default: '1'

permissions:
  contents: read
  actions: read         # download main's last results for comparison
  pull-requests: write  # keep one up-to-date report comment on the PR

concurrency:
  group: roadmap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0

      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned JDK 25, JDTLS 1.61.0 and fixture tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o jdk25.tar.gz
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz' -o jdk17.tar.gz
          curl -fsSL --retry 3 https://download.eclipse.org/jdtls/milestones/1.61.0/jdt-language-server-1.61.0-202609031315.tar.gz -o jdtls.tar.gz
          curl -fsSL --retry 3 https://downloads.gradle.org/distributions/gradle-9.1.0-bin.zip -o gradle.zip
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.21.4/protoc-3.21.4-linux-x86_64.exe -o protoc
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/protobuf/protobuf-java/3.21.4/protobuf-java-3.21.4.jar -o protobuf-java.jar
          printf '%s\n' \
            'dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e  jdk25.tar.gz' \
            '3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e  jdk17.tar.gz' \
            '338e7e73d61836651ba2453919a0d34fa763eb4e7c03342092309bffb8934c64  jdtls.tar.gz' \
            'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  gradle.zip' \
            'ae5ddc97b85d0a3a39db70c0eabe93e3f83a5d4617d354b932dc88f307e6e2ec  protoc' \
            '85d0a5b8b7e14395cd4489533433cb18eae6b197b9b5030ac0e67e679beafa8e  protobuf-java.jar' | sha256sum -c -
          tar -xzf jdk25.tar.gz && tar -xzf jdk17.tar.gz && mkdir jdtls && tar -xzf jdtls.tar.gz -C jdtls
          unzip -q gradle.zip && chmod +x protoc gradle-9.1.0/bin/gradle
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"

      - name: Harness tests
        run: |
          python3 benchmarks/roadmap/catalogue.py
          node --test benchmarks/roadmap/test/*.test.ts

      - name: Build JVMD
        run: |
          mvn -B -DskipTests install
          bash jvmd-dist/assemble.sh

      - name: Fetch main's last results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow roadmap.yml --branch main --event push --status success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n roadmap -D "$RUNNER_TEMP/baseline"

      # Informational: results are reported, never gated. The step fails only if the suite itself can't run.
      - name: Run roadmap against JVMD and JDTLS
        run: |
          T="$RUNNER_TEMP/tools"
          node benchmarks/roadmap/run.ts --output "$RUNNER_TEMP/roadmap" --runs "${{ inputs.runs || '1' }}" \
            --baseline "$RUNNER_TEMP/baseline/results.json" \
            --java-home "$JAVA_HOME" --jdtls-home "$T/jdtls" --alternate-java-home "$T/jdk-17.0.20.1+1" \
            --gradle-home "$T/gradle-9.1.0" --protoc "$T/protoc" --protobuf-java "$T/protobuf-java.jar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: roadmap
          retention-days: 30
          path: |
            ${{ runner.temp }}/roadmap/report.md
            ${{ runner.temp }}/roadmap/results.json
            ${{ runner.temp }}/roadmap/cases/*/result.json

      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          report="$RUNNER_TEMP/roadmap/report.md"
          [ -f "$report" ] || exit 0
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          # Fork PRs get a read-only token; their report stays in the job summary.
          [ -n "$PR" ] && [ "$SAME_REPO" = true ] || exit 0
          marker='<!-- jvmd-roadmap -->'
          body="$marker"$'\n'"$(cat "$report")"$'\n\n'"<sub>[Run and raw results]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)</sub>"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null; fi
