name: Semantic memory diagnostics

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-identifier-sweep:
    name: Identifier sweep / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: [baseline, candidate]

    steps:
      - name: Checkout comparison revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ matrix.label == 'baseline' && 'ae23fd1f44573bd3427c0e77f967150173669a2f' || github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Record comparison identity
        shell: bash
        run: |
          mkdir -p semantic-memory-evidence
          {
            echo "label=${{ matrix.label }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
          } | tee semantic-memory-evidence/identity.txt

      - name: Build production dependencies
        run: mvn -B -DskipTests install

      - name: Fetch and compile corpus fixture
        shell: bash
        run: |
          bash jvmd-tests/corpus/fetch.sh
          mvn -B -q -f jvmd-tests/corpus/petclinic/pom.xml test-compile

      - name: Run isolated IdentifierSweepTest with memory evidence
        id: sweep
        shell: bash
        run: |
          EVIDENCE="$GITHUB_WORKSPACE/semantic-memory-evidence"
          mkdir -p "$EVIDENCE"
          set +e
          /usr/bin/time -v -o "$EVIDENCE/time.txt" \
            mvn -B -pl jvmd-tests test \
              -Dtest=IdentifierSweepTest \
              "-DargLine=-Xmx1024m -Xlog:gc*:file=$EVIDENCE/gc.log:time,uptime,level,tags -XX:StartFlightRecording=filename=$EVIDENCE/sweep.jfr,settings=profile,maxsize=64m,dumponexit=true" \
              2>&1 | tee "$EVIDENCE/maven.log"
          status=${PIPESTATUS[0]}
          echo "$status" | tee "$EVIDENCE/exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          grep -E "sweep-file|Tests run:|Java heap space|OutOfMemory|LRU cache|BUILD (SUCCESS|FAILURE)" \
            "$EVIDENCE/maven.log" > "$EVIDENCE/highlights.txt" || true
          if [[ -s "$EVIDENCE/sweep.jfr" ]]; then
            jfr summary "$EVIDENCE/sweep.jfr" > "$EVIDENCE/jfr-summary.txt" 2>&1 || true
          fi
          exit 0

      - name: Publish diagnostic summary
        shell: bash
        run: |
          {
            echo "## ${{ matrix.label }} IdentifierSweepTest"
            echo
            echo "- revision: $(git rev-parse HEAD)"
            echo "- test exit code: ${{ steps.sweep.outputs.exit_code }}"
            echo
            echo "### Process resource summary"
            echo "~~~text"
            cat semantic-memory-evidence/time.txt || true
            echo "~~~"
            echo
            echo "### Failure/progress highlights"
            echo "~~~text"
            tail -120 semantic-memory-evidence/highlights.txt || true
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload semantic memory evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-memory-${{ matrix.label }}-${{ github.run_id }}
          path: semantic-memory-evidence/
          if-no-files-found: error
          retention-days: 30
