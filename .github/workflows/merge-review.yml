name: Merge Review

on:
  pull_request:
    # Deliberately omit synchronize: this expensive evidence runs when review starts,
    # not on every commit pushed while a PR is being developed.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merge-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/temurin25.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xzf "$RUNNER_TEMP/temurin25.tar.gz" -C "$RUNNER_TEMP/toolchain"
          echo "JAVA_HOME=$RUNNER_TEMP/toolchain/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/toolchain/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
      - name: Build production classes while fetching JDTLS
        shell: bash
        run: |
          (
            curl -fsSL --retry 3 'https://download.eclipse.org/jdtls/milestones/1.61.0/jdt-language-server-1.61.0-202609031315.tar.gz' -o "$RUNNER_TEMP/jdtls.tar.gz"
            printf '%s  %s\n' 338e7e73d61836651ba2453919a0d34fa763eb4e7c03342092309bffb8934c64 "$RUNNER_TEMP/jdtls.tar.gz" | sha256sum --check -
            mkdir "$RUNNER_TEMP/jdtls" && tar -xzf "$RUNNER_TEMP/jdtls.tar.gz" -C "$RUNNER_TEMP/jdtls"
          ) &
          jdtls_download=$!
          # Tests are exercised by the normal checkpoint workflow. Avoid even compiling
          # them here, and use all available cores for the production reactor.
          mvn -B -T1C -Dmaven.test.skip=true -pl jvmd-dist,jvmd-resolver/maven3,jvmd-resolver/maven4 -am install
          bash jvmd-dist/assemble.sh
          wait "$jdtls_download"
      - name: Install pinned Node.js for the TypeScript LSP bridge
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Compile reproducible benchmark fixture
        run: |
          deps="$PWD/jvmd-dist/target/image/lib/jvmd"
          # Maven already compiled production. Compile only the small benchmark
          # adapters instead of compiling the entire JVMD source tree a second time.
          python benchmarks/workspaces/compile.py --repo "$PWD" --java-home "$JAVA_HOME" --dependencies "$deps" --output "$RUNNER_TEMP/build" --reuse-production-jars
          # 192 sources plus 64 dependency JARs, with an exact generated oracle.
          python benchmarks/workspaces/fixture.py --build "$RUNNER_TEMP/build/build.json" --dependencies "$deps" --root "$RUNNER_TEMP/fixtures" --fixture-names review
      - name: Fast JVMD and JDTLS correctness benchmark
        run: |
          python benchmarks/workspaces/matrix.py --repo "$PWD" --before "$RUNNER_TEMP/build/build.json" --after "$RUNNER_TEMP/build/build.json" \
            --java-home "$JAVA_HOME" --jdtls "$RUNNER_TEMP/jdtls" --resolvers "$PWD/jvmd-dist/target/image/lib/jvmd/resolvers" \
            --fixtures "$RUNNER_TEMP/fixtures" --root "$RUNNER_TEMP/results" --runs 1 --sources 192 --workspaces 1 --samples 1 --edits 2 \
            --fixture-names review --modes after jdtls-shared
          python benchmarks/workspaces/verify.py "$RUNNER_TEMP/results" "$RUNNER_TEMP/verification.json"
          python benchmarks/workspaces/summarize.py "$RUNNER_TEMP/results" "$RUNNER_TEMP/summary.json"
          python benchmarks/workspaces/compare.py "$RUNNER_TEMP/summary.json" "$RUNNER_TEMP/comparison.json" --markdown "$RUNNER_TEMP/comparison.md"
          python benchmarks/workspaces/matrix.py --repo "$PWD" --before "$RUNNER_TEMP/build/build.json" --after "$RUNNER_TEMP/build/build.json" \
            --java-home "$JAVA_HOME" --jdtls "$RUNNER_TEMP/jdtls" --resolvers "$PWD/jvmd-dist/target/image/lib/jvmd/resolvers" \
            --fixtures "$RUNNER_TEMP/fixtures" --root "$RUNNER_TEMP/allocation-results" --runs 1 --sources 192 --workspaces 1 --samples 1 --edits 2 \
            --fixture-names review --modes after jdtls-shared --profile
          python benchmarks/workspaces/verify.py "$RUNNER_TEMP/allocation-results" "$RUNNER_TEMP/allocation-verification.json"
          python benchmarks/workspaces/summarize.py "$RUNNER_TEMP/allocation-results" "$RUNNER_TEMP/allocation-summary.json"
          python benchmarks/workspaces/compare.py "$RUNNER_TEMP/allocation-summary.json" "$RUNNER_TEMP/allocation-comparison.json" --metrics sampled_allocated_mib peak_rss_mib cpu_seconds --markdown "$RUNNER_TEMP/allocation-comparison.md"
          node benchmarks/workspaces/dashboard.mjs --comparison "$RUNNER_TEMP/comparison.json" --allocation "$RUNNER_TEMP/allocation-comparison.json" --verification "$RUNNER_TEMP/verification.json" --output "$RUNNER_TEMP/dashboard.html"
          cat "$RUNNER_TEMP/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Sampled allocation profile\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/allocation-comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merge evidence and dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-review-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dashboard.html
            ${{ runner.temp }}/comparison.*
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/verification.json
            ${{ runner.temp }}/allocation-*.json
            ${{ runner.temp }}/allocation-*.md
            ${{ runner.temp }}/results/**/report.json
            ${{ runner.temp }}/results/**/messages.jsonl
            ${{ runner.temp }}/results/**/resources.json
            ${{ runner.temp }}/allocation-results/**/report.json
            ${{ runner.temp }}/allocation-results/**/messages.jsonl
            ${{ runner.temp }}/allocation-results/**/resources.json
      - name: Publish merge evidence on the PR
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$HEAD_BRANCH" --jq '.[0].number // empty')"
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo 'No open pull request found for this branch; evidence remains on the workflow run.'
            exit 0
          fi
          body="$RUNNER_TEMP/pr-evidence.md"
          {
            echo '<!-- jvmd-merge-review -->'
            echo '## JVMD / JDTLS merge evidence'
            echo
            cat "$RUNNER_TEMP/comparison.md"
            echo
            echo '## Sampled allocation profile'
            echo
            cat "$RUNNER_TEMP/allocation-comparison.md"
            echo
            printf '[Download the dashboard and independently verified raw evidence](https://github.com/%s/actions/runs/%s)\n' \
              '${{ github.repository }}' '${{ github.run_id }}'
          } > "$body"
          comments="repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
          comment_id="$(gh api "$comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- jvmd-merge-review -->"))) | .id' | tail -1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -F "body=@$body" >/dev/null
          else
            gh api --method POST "$comments" -F "body=@$body" >/dev/null
          fi
