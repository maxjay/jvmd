name: LSP scenarios
# Scheduler changes under shim/** are part of this integration gate.

on:
  pull_request:
    paths:
      - 'benchmarks/phase-model.json'
      - 'benchmarks/lsp-scenarios/**'
      - 'benchmarks/workspaces/**'
      - 'benchmarks/measurement-contract.json'
      - 'jvmd-analyzer/**'
      - 'jvmd-index/**'
      - 'jvmd-index-rocks/**'
      - 'jvmd-dist/**'
      - 'jvmd-lsp/**'
      - 'shim/src/**'
      - 'shim/test/**'
      - '.github/workflows/lsp-scenarios.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/phase-model.json'
      - 'benchmarks/lsp-scenarios/**'
      - 'benchmarks/workspaces/**'
      - 'benchmarks/measurement-contract.json'
      - 'jvmd-analyzer/**'
      - 'jvmd-index/**'
      - 'jvmd-index-rocks/**'
      - 'jvmd-dist/**'
      - 'jvmd-lsp/**'
      - 'shim/src/**'
      - 'shim/test/**'
      - '.github/workflows/lsp-scenarios.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [compare]
        default: compare

permissions:
  contents: read

concurrency:
  group: lsp-scenarios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0

      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned JDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/downloads/temurin25.tar.gz
          key: jdk-${{ runner.os }}-${{ runner.arch }}-dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e

      - name: Install pinned JDK
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/downloads"
          [[ -f "$RUNNER_TEMP/downloads/temurin25.tar.gz" ]] || curl -fsSL --retry 3             'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz'             -o "$RUNNER_TEMP/downloads/temurin25.tar.gz"
          printf '%s  %s\n'             dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e             "$RUNNER_TEMP/downloads/temurin25.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/downloads/temurin25.tar.gz" -C "$RUNNER_TEMP/tools"
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"

      - name: Install harness dependency
        run: npm install --prefix benchmarks/lsp-scenarios --ignore-scripts

      - name: Harness contract tests
        run: |
          python3 benchmarks/lsp-scenarios/catalogue.py
          node --test benchmarks/lsp-scenarios/test/*.test.ts
          python3 -m unittest discover -s benchmarks/workspaces -p 'test_*.py'

      - name: Restore prepared Apache Maven fixture
        id: fixture
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/apache-maven-fixture
          key: apache-maven-lsp-v1

      - name: Prepare Apache Maven fixture
        if: steps.fixture.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/apache/maven.git "$RUNNER_TEMP/apache-maven-fixture"
          git -C "$RUNNER_TEMP/apache-maven-fixture" checkout 5cd1b60264101080c712accd605180a4bd9222e0
          cd "$RUNNER_TEMP/apache-maven-fixture"
          mvn -B -DskipTests install

      - name: Build JVMD
        id: build
        run: |
          mvn -B -DskipTests install
          bash jvmd-dist/assemble.sh

      - name: Measure JVMD machine daemon lifecycle
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/apache-maven-fixture
          MACHINE_REPORT_FILE: ${{ runner.temp }}/jvmd-machine-lifecycle.json
        run: node benchmarks/lsp-scenarios/jvmd-machine-lifecycle.ts

      - name: Cache pinned JDTLS archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/jdtls.tar.gz
          key: jdtls-338e7e73d61836651ba2453919a0d34fa763eb4e7c03342092309bffb8934c64

      - name: Install JDTLS
        id: jdtls
        run: |
          mkdir -p "$RUNNER_TEMP/jdtls"
          [[ -f "$RUNNER_TEMP/jdtls.tar.gz" ]] || curl -fsSL --retry 3             https://download.eclipse.org/jdtls/milestones/1.61.0/jdt-language-server-1.61.0-202609031315.tar.gz             -o "$RUNNER_TEMP/jdtls.tar.gz"
          printf '%s  %s\n'             338e7e73d61836651ba2453919a0d34fa763eb4e7c03342092309bffb8934c64             "$RUNNER_TEMP/jdtls.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/jdtls.tar.gz" -C "$RUNNER_TEMP/jdtls"

      - name: Prepare pinned protobuf tools
        id: protobuf-tools
        run: |
          mkdir -p "$RUNNER_TEMP/protobuf-tools"
          cd "$RUNNER_TEMP/protobuf-tools"
          curl -fsSL --retry 3 https://downloads.gradle.org/distributions/gradle-9.1.0-bin.zip -o gradle.zip
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.21.4/protoc-3.21.4-linux-x86_64.exe -o protoc
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/protobuf/protobuf-java/3.21.4/protobuf-java-3.21.4.jar -o protobuf-java.jar
          printf '%s\n' \
            'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  gradle.zip' \
            'ae5ddc97b85d0a3a39db70c0eabe93e3f83a5d4617d354b932dc88f307e6e2ec  protoc' \
            '85d0a5b8b7e14395cd4489533433cb18eae6b197b9b5030ac0e67e679beafa8e  protobuf-java.jar' | sha256sum -c -
          unzip -q gradle.zip
          chmod +x protoc gradle-9.1.0/bin/gradle

      - name: Measure JDTLS phases
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/apache-maven-fixture
          MODE: compare
          SERVER: jdtls
          JDTLS_HOME: ${{ runner.temp }}/jdtls
          REPORT_FILE: ${{ runner.temp }}/jdtls-report.json
        run: node benchmarks/lsp-scenarios/run.ts

      - name: Measure JVMD phases
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/apache-maven-fixture
          MODE: compare
          SERVER: jvmd
          REPORT_FILE: ${{ runner.temp }}/jvmd-report.json
        run: node benchmarks/lsp-scenarios/run.ts

      - name: Compare phase reports
        run: node benchmarks/lsp-scenarios/compare.ts "$RUNNER_TEMP/jdtls-report.json" "$RUNNER_TEMP/jvmd-report.json"

      # These are correctness/diagnostic pilots. One block cannot authorize a
      # comparative performance claim. Failures do not suppress later capture.
      - name: Native lifecycle with packaged daemon and shim
        if: always() && steps.build.outcome == 'success'
        run: |
          node benchmarks/lsp-scenarios/jvmd-machine-lifecycle.ts --matrix \
            --profile product --java-home "$JAVA_HOME" \
            --output "$RUNNER_TEMP/native-lifecycle-clean" --edits 128 --trace false \
            --apache-fixture "$RUNNER_TEMP/apache-maven-fixture" \
            --apache-repository "$HOME/.m2/repository"

      - name: Separate lifecycle attribution profile
        if: always() && steps.build.outcome == 'success'
        run: |
          node benchmarks/lsp-scenarios/jvmd-machine-lifecycle.ts --matrix \
            --profile product --java-home "$JAVA_HOME" \
            --output "$RUNNER_TEMP/native-lifecycle-traced" --edits 128 --trace true \
            --apache-fixture "$RUNNER_TEMP/apache-maven-fixture" \
            --apache-repository "$HOME/.m2/repository"

      - name: Protobuf generation and generated-type readiness
        if: always() && steps.jdtls.outcome == 'success' && steps.protobuf-tools.outcome == 'success'
        run: |
          node benchmarks/lsp-scenarios/run.ts --servers jdtls --profile direct \
            --java-home "$JAVA_HOME" --jdtls-home "$RUNNER_TEMP/jdtls" \
            --gradle-home "$RUNNER_TEMP/protobuf-tools/gradle-9.1.0" \
            --protoc "$RUNNER_TEMP/protobuf-tools/protoc" \
            --protobuf-java "$RUNNER_TEMP/protobuf-tools/protobuf-java.jar" \
            --only BLD-02 --blocks 1 --warmup 1 --samples 1 --timeout-ms 90000 \
            --output "$RUNNER_TEMP/protobuf-evidence"

      - name: Upload protobuf raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protobuf-evidence
          retention-days: 7
          include-hidden-files: true
          path: ${{ runner.temp }}/protobuf-evidence

      - name: Upload phase reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lsp-phase-reports
          retention-days: 7
          path: |
            ${{ runner.temp }}/jdtls-report.json
            ${{ runner.temp }}/jvmd-report.json
            ${{ runner.temp }}/jvmd-machine-lifecycle.json

      - name: Upload native lifecycle raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifecycle-evidence
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/native-lifecycle-clean
            ${{ runner.temp }}/native-lifecycle-traced

      - name: Package bounded review copies
        if: always() && steps.build.outcome == 'success'
        run: |
          python3 benchmarks/workspaces/package_evidence.py "$RUNNER_TEMP/native-lifecycle-clean" "$RUNNER_TEMP/native-clean-review.zip"
          python3 benchmarks/workspaces/package_evidence.py "$RUNNER_TEMP/native-lifecycle-traced" "$RUNNER_TEMP/native-traced-review.zip"

      - name: Upload native lifecycle review copies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifecycle-review
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-clean-review.zip
            ${{ runner.temp }}/native-traced-review.zip
