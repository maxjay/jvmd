name: Merge Review

on:
  pull_request:
    # Refresh changed benchmark/report code; ordinary implementation pushes remain gated below.
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merge-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed
        env:
          ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$ACTION" != synchronize ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            git fetch --depth=1 origin "$BEFORE_SHA"
            if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- benchmarks .github/workflows/merge-review.yml; then
              echo 'run=false' >> "$GITHUB_OUTPUT"
            else
              echo 'run=true' >> "$GITHUB_OUTPUT"
            fi
          fi
  evidence:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/temurin25.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xzf "$RUNNER_TEMP/temurin25.tar.gz" -C "$RUNNER_TEMP/toolchain"
          echo "JAVA_HOME=$RUNNER_TEMP/toolchain/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/toolchain/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
      - name: Build production classes
        run: |
          mvn -B -T1C -Dmaven.test.skip=true -pl jvmd-dist,jvmd-resolver/maven3,jvmd-resolver/maven4 -am install
          bash jvmd-dist/assemble.sh
      - name: Install pinned Node.js for the TypeScript LSP bridge
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Compile reproducible benchmark fixture
        run: |
          deps="$PWD/jvmd-dist/target/image/lib/jvmd"
          # Maven already compiled production. Compile only the small benchmark
          # adapters instead of compiling the entire JVMD source tree a second time.
          python benchmarks/workspaces/compile.py --repo "$PWD" --java-home "$JAVA_HOME" --dependencies "$deps" --output "$RUNNER_TEMP/build" --reuse-production-jars
      - name: Compare semantic state against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Manual runs compare against the preceding commit. PR runs use the exact PR base.
          if [[ -z "$BASE_SHA" ]]; then
            git fetch --depth=2 origin "$HEAD_SHA"
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/semantic-base" "$BASE_SHA"
          (
            cd "$RUNNER_TEMP/semantic-base"
            mvn -B -T1C -Dmaven.test.skip=true -pl jvmd-dist -am package
          )
          JAVA_HOME="$JAVA_HOME" benchmarks/semantic-state/run.sh \
            "$RUNNER_TEMP/semantic-base/jvmd-dist/target/*:$RUNNER_TEMP/semantic-base/jvmd-dist/target/lib/*" \
            "$PWD/jvmd-dist/target/*:$PWD/jvmd-dist/target/lib/*" "$RUNNER_TEMP/semantic-state"
          python benchmarks/semantic-state/summarize.py "$RUNNER_TEMP/semantic-state" "$RUNNER_TEMP/semantic-state-summary.json" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: Compare input validation against the PR base
        shell: bash
        run: |
          deps="$PWD/jvmd-dist/target/image/lib/jvmd"
          python benchmarks/input-validation/prepare.py --repo "$RUNNER_TEMP/semantic-base" --dependencies "$RUNNER_TEMP/semantic-base/jvmd-dist/target/lib" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/input-base"
          python benchmarks/input-validation/prepare.py --repo "$PWD" --dependencies "$deps" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/input-candidate"
          python benchmarks/input-validation/run.py "$RUNNER_TEMP/input-base/build.json" "$RUNNER_TEMP/input-candidate/build.json" "$RUNNER_TEMP/input-validation"
          python benchmarks/input-validation/summarize.py "$RUNNER_TEMP/input-validation" "$RUNNER_TEMP/input-validation-summary.json"
      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-review-evidence
          retention-days: 30
          path: |
            ${{ runner.temp }}/input-validation-summary.json
            ${{ runner.temp }}/input-validation/*.json
            ${{ runner.temp }}/semantic-state-summary.json
            ${{ runner.temp }}/semantic-state/*.json
            ${{ runner.temp }}/semantic-state/disk-kib.txt
