name: Distributions
on:
  pull_request:
    paths:
      - '.github/workflows/releases.yml'
      - 'jvmd-dist/**'
      - 'shim/**'
      - 'docs/install.md'
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build, train, package, and test the relocated archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.1.0-preview.$GITHUB_RUN_NUMBER"
          fi
          python3 jvmd-dist/export-api.py --check
          python3 jvmd-dist/release/build.py --version "$version"
      - name: Save platform archive and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvmd-${{ matrix.platform }}
          path: jvmd-dist/target/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require a tested commit from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          revision="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$revision&status=success&per_page=100" \
            --jq '.workflow_runs | any(.name == "Checkpoints")' | grep -qx true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: jvmd-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp jvmd-dist/install.sh jvmd-dist/install-wsl.ps1 release-assets/
          (cd release-assets && sha256sum install.sh > install.sh.sha256 && sha256sum install-wsl.ps1 > install-wsl.ps1.sha256)
          (cd release-assets && cat ./*.sha256 > SHA256SUMS)
          cp docs/install.md release-notes.md
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "jvmd $GITHUB_REF_NAME" --notes-file release-notes.md "${options[@]}"
