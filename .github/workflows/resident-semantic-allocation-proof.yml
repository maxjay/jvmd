name: Resident Semantic Allocation Proof

on:
  push:
    paths:
      - '.github/workflows/resident-semantic-allocation-proof.yml'
      - '.github/proof/ResidentSemanticAllocationProof.java'

permissions:
  contents: read

jobs:
  allocation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROOF_SUBJECT_SHA: 8babf10f74ef792c50b6ce51bf789c75f8bae8f2
    steps:
      - name: Checkout proof machinery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: proof

      - name: Checkout exact subject revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PROOF_SUBJECT_SHA }}
          path: subject

      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: resident-proof-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('subject/**/pom.xml') }}
          restore-keys: resident-proof-maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned JDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/downloads/temurin25.tar.gz
          key: jdk-${{ runner.os }}-${{ runner.arch }}-dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e

      - name: Install checksum-pinned Temurin 25.0.4.1+1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          [[ -f "$RUNNER_TEMP/downloads/temurin25.tar.gz" ]] || curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/downloads/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/downloads/temurin25.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/jvmd-toolchain"
          tar -xzf "$RUNNER_TEMP/downloads/temurin25.tar.gz" -C "$RUNNER_TEMP/jvmd-toolchain"
          echo "JAVA_HOME=$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"

      - name: Verify exact base and install proof source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C subject rev-parse HEAD)"
          echo "proof_subject_sha=$actual"
          test "$actual" = "$PROOF_SUBJECT_SHA"
          cp proof/.github/proof/ResidentSemanticAllocationProof.java subject/jvmd-tests/src/test/java/dev/jvmd/tests/ResidentSemanticAllocationProof.java
          {
            echo "subject_sha=$actual"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            uname -a
            grep -m1 'model name' /proc/cpuinfo || true
            grep -E 'MemTotal|SwapTotal' /proc/meminfo || true
          } | tee "$RUNNER_TEMP/resident-proof-provenance.txt"

      - name: Build exact subject
        working-directory: subject
        run: |
          java -version
          mvn -version
          mvn -B -DskipTests install
          mvn -B -pl jvmd-tests dependency:build-classpath -DincludeScope=test -Dmdep.outputFile="$RUNNER_TEMP/resident-proof-cp.txt"

      - name: Run temporary allocation and JFR proof
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/resident-proof-results"
          mkdir -p "$results"
          cp "$RUNNER_TEMP/resident-proof-provenance.txt" "$results/provenance.txt"
          cp="$GITHUB_WORKSPACE/subject/jvmd-tests/target/test-classes:$(cat "$RUNNER_TEMP/resident-proof-cp.txt")"
          flags=(
            -Xms128m -Xmx768m
            --enable-native-access=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.platform=ALL-UNNAMED
            "-Djvmd.proof.subject=$PROOF_SUBJECT_SHA"
            "-Djvmd.resolvers=$GITHUB_WORKSPACE/subject/jvmd-resolver/maven3/target"
            "-Dbasedir=$GITHUB_WORKSPACE/subject/jvmd-tests"
          )
          scenarios=(
            cold_first_completion warm_unchanged_completion prefix_narrowing
            body_only_receiver_edit documentation_only_edit api_addition api_removal api_rename
            a_b_a multi_module_a_b_a unsaved_source_open_close
            deep_inheritance wide_inheritance inaccessible_beyond_limit overridden_beyond_limit
            unqualified_type_merge
          )
          for scenario in "${scenarios[@]}"; do
            echo "::group::measure $scenario"
            java "${flags[@]}" -cp "$cp" dev.jvmd.tests.ResidentSemanticAllocationProof measure "$scenario" "$results/$scenario.measure.json"
            cat "$results/$scenario.measure.json"
            echo "::endgroup::"
            echo "::group::profile $scenario"
            java "${flags[@]}" -cp "$cp" dev.jvmd.tests.ResidentSemanticAllocationProof profile "$scenario" "$results/$scenario.profile.json"
            cat "$results/$scenario.profile.json"
            echo "::endgroup::"
          done

          python3 - "$results" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          combined={"subject_sha":"70d14dab9fd086121f8eab78cea0d1974b986b47","scenarios":{}}
          errors=[]
          rows=[]
          for measure in sorted(root.glob("*.measure.json")):
              name=measure.name.removesuffix(".measure.json")
              profile=root/(name+".profile.json")
              m=json.loads(measure.read_text())
              p=json.loads(profile.read_text())
              combined["scenarios"][name]={"measure":m,"profile":p}
              if "error" in m: errors.append((name,"measure",m["error"]))
              if "error" in p: errors.append((name,"profile",p["error"]))
              rows.append([
                  name,
                  m.get("latency_ms"),
                  m.get("thread_allocated_bytes"),
                  m.get("retained_heap_after_bytes"),
                  m.get("retained_heap_delta_bytes"),
                  m.get("peak_heap_bytes"),
                  m.get("peak_rss_bytes"),
                  p.get("sampled_weight_bytes"),
                  (m.get("outcome") or {}).get("semantic_facts"),
                  (m.get("outcome") or {}).get("semantic_fact_mutations"),
              ])
          (root/"summary.json").write_text(json.dumps(combined,indent=2))
          def num(v,scale=1):
              return "—" if v is None else f"{v/scale:.3f}" if isinstance(v,(int,float)) else str(v)
          md=[
              "# Resident semantic allocation proof",
              "",
              "Subject: 70d14dab9fd086121f8eab78cea0d1974b986b47",
              "",
              "| Scenario | latency ms | thread alloc MiB | retained heap MiB | retained Δ MiB | peak heap MiB | peak RSS MiB | JFR sampled weight MiB | semantic facts | fact mutations |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for r in rows:
              md.append("| "+" | ".join([
                  r[0],num(r[1]),num(r[2],1048576),num(r[3],1048576),num(r[4],1048576),
                  num(r[5],1048576),num(r[6],1048576),num(r[7],1048576),num(r[8]),num(r[9])
              ])+" |")
          if errors:
              md += ["","## Harness errors"]+[f"- {n} {mode}: {err}" for n,mode,err in errors]
          (root/"summary.md").write_text("\n".join(md)+"\n")
          print((root/"summary.md").read_text())
          if errors:
              raise SystemExit(1)
          PY

      - name: Upload temporary proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resident-semantic-allocation-proof-${{ env.PROOF_SUBJECT_SHA }}
          path: ${{ runner.temp }}/resident-proof-results
          retention-days: 7
