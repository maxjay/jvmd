name: Checkpoints
on:
  push:
    branches: [main, codex/implementation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checkpoints-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          cache: maven
      - name: Compile and package
        run: mvn -B -DskipTests install
      - name: Assemble runtime and train AOT
        run: |
          bash jvmd-dist/assemble.sh
          bash jvmd-dist/train-aot.sh
      - name: Phase 1 checkpoints including performance budgets
        run: mvn -B -pl jvmd-tests test -Dgroups=phase-1 -DexcludedGroups=corpus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-evidence
          path: |
            jvmd-tests/target/surefire-reports/
            jvmd-tests/target/*perf.json
            jvmd-dist/target/training-state/*.log
