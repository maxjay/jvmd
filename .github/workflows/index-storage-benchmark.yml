name: Index Storage Benchmark
on:
  push:
    branches: [benchmark/index-storage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/temurin25.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/jvmd-toolchain"
          tar -xzf "$RUNNER_TEMP/temurin25.tar.gz" -C "$RUNNER_TEMP/jvmd-toolchain"
          echo "JAVA_HOME=$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jvmd-toolchain/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
      - name: Build SQLite control
        run: mvn -B -DskipTests install -pl jvmd-tests -am
      - name: SQLite baseline
        run: mvn -B -pl jvmd-tests test -Dtest=IndexRebuildBaselineTest -DexcludedGroups=
      - name: Bulk storage prototypes
        run: mvn -B -f jvmd-index-prototypes/pom.xml test -Djvmd.prototype.symbols=100000 -Djvmd.prototype.relationships=200000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: index-storage-measurements
          path: |
            jvmd-tests/target/index-rebuild-baseline.json
            jvmd-index-prototypes/target/index-prototype-results.json
            jvmd-index-prototypes/target/surefire-reports/
