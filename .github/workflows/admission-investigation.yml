name: Admission investigation (temporary)
on:
  push:
    branches: [pr39-admitted-semantic-hotpath]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0

      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned JDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/downloads/temurin25.tar.gz
          key: jdk-${{ runner.os }}-${{ runner.arch }}-dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e

      - name: Install pinned JDK
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/downloads"
          [[ -f "$RUNNER_TEMP/downloads/temurin25.tar.gz" ]] || curl -fsSL --retry 3             'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz'             -o "$RUNNER_TEMP/downloads/temurin25.tar.gz"
          printf '%s  %s\n'             dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e             "$RUNNER_TEMP/downloads/temurin25.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/downloads/temurin25.tar.gz" -C "$RUNNER_TEMP/tools"
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"

      - name: Install harness dependency
        run: npm install --prefix benchmarks/lsp-scenarios --ignore-scripts

      - name: Harness phase tests
        run: node --test benchmarks/lsp-scenarios/test/*.test.ts

      - name: Restore prepared Apache Maven fixture
        id: fixture
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/apache-maven-fixture
          key: apache-maven-lsp-v1

      - name: Prepare Apache Maven fixture
        if: steps.fixture.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/apache/maven.git "$RUNNER_TEMP/apache-maven-fixture"
          git -C "$RUNNER_TEMP/apache-maven-fixture" checkout 5cd1b60264101080c712accd605180a4bd9222e0
          cd "$RUNNER_TEMP/apache-maven-fixture"
          mvn -B -DskipTests install

      - name: Apply disposable tracing
        run: python3 benchmarks/semantic-admission/instrument.py

      - name: Build JVMD
        run: |
          mvn -B -DskipTests install
          bash jvmd-dist/assemble.sh

      - name: Same-binary admission A/B
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/apache-maven-fixture
          MODE: compare
          SERVER: jvmd
        run: |
          mkdir -p "$RUNNER_TEMP/admission"
          git rev-parse HEAD > "$RUNNER_TEMP/admission/subject.txt"
          git diff > "$RUNNER_TEMP/admission/instrumentation.patch"
          for state in MUTATION_VISIBLE EXACT_ADMITTED; do
            export ADMISSION_MODE="$state"
            export ADMISSION_JFR="$RUNNER_TEMP/admission/$state.jfr"
            export REPORT_FILE="$RUNNER_TEMP/admission/$state.json"
            node benchmarks/semantic-admission-lsp/run.ts > "$RUNNER_TEMP/admission/$state.log" 2>&1
            "$JAVA_HOME/bin/jfr" print --json --events dev.jvmd.Stage "$ADMISSION_JFR" > "$RUNNER_TEMP/admission/$state.stages.json"
            python3 benchmarks/semantic-admission/summarize.py "$RUNNER_TEMP/admission/$state.stages.json" > "$RUNNER_TEMP/admission/$state.summary.txt"
          done
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admission-investigation
          retention-days: 14
          path: ${{ runner.temp }}/admission
