name: Benchmark report
on:
  workflow_run:
    workflows: [Benchmarks]
    types: [in_progress, completed]
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: benchmark-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish check and update PR table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python benchmarks/workspaces/check.py
