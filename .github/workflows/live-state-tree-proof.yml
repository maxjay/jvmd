name: Live State Tree Proof
on:
  pull_request:
    paths:
      - 'jvmd-*/src/main/**'
      - 'benchmarks/live-state-tree-proof.py'
      - 'benchmarks/workspaces/**'
      - 'docs/live-state-tree-*.md'
      - '.github/workflows/live-state-tree-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-state-tree-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Cache third-party Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/dev/jvmd
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache pinned JDK archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/downloads/temurin25.tar.gz
          key: jdk-${{ runner.os }}-${{ runner.arch }}-dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e
      - name: Install pinned JDK
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/downloads"
          [[ -f "$RUNNER_TEMP/downloads/temurin25.tar.gz" ]] || curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/downloads/temurin25.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/downloads/temurin25.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/downloads/temurin25.tar.gz" -C "$RUNNER_TEMP/tools"
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Maven bootstrap
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/workflow-maven
          key: maven-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jvmd-dist/release/toolchains.json') }}
      - name: Reuse pinned release Maven bootstrap
        run: |
          python - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('release_tools','jvmd-dist/release/build.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          maven=module.toolchain(module.PINS['maven'],Path(os.environ['RUNNER_TEMP'])/'workflow-maven')
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(maven/'bin')+'\n')
          PYCODE
      - name: Cache prepared Apache Maven fixture
        id: apache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/apache-maven-fixture
          key: apache-maven-lsp-v1-5cd1b60264101080c712accd605180a4bd9222e0
      - name: Prepare Apache Maven fixture
        if: steps.apache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/apache/maven.git "$RUNNER_TEMP/apache-maven-fixture"
          git -C "$RUNNER_TEMP/apache-maven-fixture" checkout 5cd1b60264101080c712accd605180a4bd9222e0
          (cd "$RUNNER_TEMP/apache-maven-fixture" && mvn -B -DskipTests install)
      - name: Restore disposable fixture copy
        run: |
          rm -rf "$RUNNER_TEMP/apache-maven-run"
          mkdir -p "$RUNNER_TEMP/apache-maven-run"
          cp -a "$RUNNER_TEMP/apache-maven-fixture/." "$RUNNER_TEMP/apache-maven-run/"
      - name: Build JVMD and benchmark bridge
        run: |
          mvn -B -DskipTests install
          bash jvmd-dist/assemble.sh
          python benchmarks/workspaces/compile.py --repo "$PWD" --java-home "$JAVA_HOME" --dependencies "$PWD/jvmd-dist/target/image/lib/jvmd" --output "$RUNNER_TEMP/workflow-build" --reuse-production-jars
      - name: Run live-state-tree proof
        run: |
          python benchmarks/live-state-tree-proof.py \
            --repo "$PWD" \
            --build "$RUNNER_TEMP/workflow-build/build.json" \
            --java-home "$JAVA_HOME" \
            --resolvers "$PWD/jvmd-dist/target/image/lib/jvmd/resolvers" \
            --fixture "$RUNNER_TEMP/apache-maven-run" \
            --output "$RUNNER_TEMP/live-state-tree-proof"
      - name: Publish summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/live-state-tree-proof/evidence.json" ]]; then
            python - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'live-state-tree-proof/evidence.json').read_text())
          print('| case | latency ms |')
          print('| --- | ---: |')
          for name,row in data['cases'].items():print(f"| {name} | {row['latency_ms']:.3f} |")
          print()
          print('Allocation evidence and status-counter deltas are in the uploaded artifact.')
          PYCODE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-state-tree-proof-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/live-state-tree-proof/evidence.json
            ${{ runner.temp }}/live-state-tree-proof/resources.json
            ${{ runner.temp }}/live-state-tree-proof/profile/trace.json
            ${{ runner.temp }}/live-state-tree-proof/profile/attribution.json
            ${{ runner.temp }}/live-state-tree-proof/profile/profile-events.json
            ${{ runner.temp }}/live-state-tree-proof/messages.jsonl
            ${{ runner.temp }}/live-state-tree-proof/stderr.log
