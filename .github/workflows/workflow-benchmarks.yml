name: Prepared language services
on:
  pull_request:
    paths:
      - 'benchmarks/workspaces/**'
      - 'jvmd-*/src/main/**'
      - '.github/workflows/workflow-benchmarks.yml'
  workflow_dispatch:
    inputs:
      evidence:
        description: Five independent paired processes with 20 warm samples each
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BENCH_REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence && '5' || '1' }}
      BENCH_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence && '20' || '2' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Install pinned JDK and JDTLS
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/jdtls"
          curl -fsSL --retry 3 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/jdk.tar.gz"
          printf '%s  %s\n' dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e "$RUNNER_TEMP/jdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP/tools"
          echo "JAVA_HOME=$RUNNER_TEMP/tools/jdk-25.0.4.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/jdk-25.0.4.1+1/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 'https://download.eclipse.org/jdtls/milestones/1.61.0/jdt-language-server-1.61.0-202609031315.tar.gz' -o "$RUNNER_TEMP/jdtls.tar.gz"
          printf '%s  %s\n' 338e7e73d61836651ba2453919a0d34fa763eb4e7c03342092309bffb8934c64 "$RUNNER_TEMP/jdtls.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/jdtls.tar.gz" -C "$RUNNER_TEMP/jdtls"
      - name: Reuse pinned release Maven bootstrap
        run: |
          python - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('release_tools','jvmd-dist/release/build.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          maven=module.toolchain(module.PINS['maven'],Path(os.environ['RUNNER_TEMP'])/'workflow-maven')
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(maven/'bin')+'\n')
          PYCODE
      - name: Build and record provenance
        run: |
          mvn -B -DskipTests install
          bash jvmd-dist/assemble.sh
          python benchmarks/workspaces/compile.py --repo "$PWD" --java-home "$JAVA_HOME" --dependencies "$PWD/jvmd-dist/target/image/lib/jvmd" --output "$RUNNER_TEMP/workflow-build" --reuse-production-jars
      - name: Harness regressions
        run: |
          python -m unittest discover -s benchmarks/workspaces -p 'test_harness.py'
          node --test benchmarks/workspaces/dashboard.test.mjs
      - name: Prepared comparison, separate attribution and overhead
        run: |
          failed=0
          for mode in comparison attribution overhead; do
            options=()
            if [[ "$mode" == attribution ]]; then options=(--mode attribution --runs 1); fi
            if [[ "$mode" == overhead ]]; then options=(--overhead); fi
            python benchmarks/workspaces/run.py --repo "$PWD" --build "$RUNNER_TEMP/workflow-build/build.json" --java-home "$JAVA_HOME" --jdtls "$RUNNER_TEMP/jdtls" --resolvers "$PWD/jvmd-dist/target/image/lib/jvmd/resolvers" --root "$RUNNER_TEMP/results/$mode" --runs "$BENCH_REPETITIONS" --samples "$BENCH_SAMPLES" "${options[@]}" || failed=1
          done
          exit "$failed"
      - name: Verify and render every result including failures
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for root in "$RUNNER_TEMP/results"/*; do
            python benchmarks/workspaces/verify.py "$root" "$root/verification.json" || failed=1
            python benchmarks/workspaces/summarize.py "$root" "$root/summary.json" --markdown "$root/summary.md"
            node benchmarks/workspaces/dashboard.mjs --summary "$root/summary.json" --output "$root/dashboard.html"
            cat "$root/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-server-evidence
          retention-days: 30
          path: |
            ${{ runner.temp }}/results/**/report.json
            ${{ runner.temp }}/results/**/summary.*
            ${{ runner.temp }}/results/**/dashboard.html
            ${{ runner.temp }}/results/**/provenance.json
            ${{ runner.temp }}/results/**/command.json
            ${{ runner.temp }}/results/**/bridge.json
            ${{ runner.temp }}/results/**/messages.jsonl
            ${{ runner.temp }}/results/**/stderr.log
            ${{ runner.temp }}/results/**/resources.json
            ${{ runner.temp }}/results/**/resource-samples.jsonl
            ${{ runner.temp }}/results/**/verification.json
            ${{ runner.temp }}/results/**/trace.json
            ${{ runner.temp }}/results/**/attribution.json
            ${{ runner.temp }}/results/**/profile-events.json
            ${{ runner.temp }}/results/**/profiles.json
            ${{ runner.temp }}/results/**/stages.jfc
            ${{ runner.temp }}/results/**/fixture.json
            ${{ runner.temp }}/workflow-build/build.json
